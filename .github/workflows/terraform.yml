name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - terraform-free-tier-learning

  pull_request:
    branches:
      - main
      - terraform-free-tier-learning

  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - init
          - validate
          - plan
          - apply
          - destroy
          - destroy-plan

# Required for GitHub OIDC authentication
permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.8.5"
  TF_WORKING_DIR: "terraform-aws-free-tier-learning"
  AWS_REGION: "ap-south-1"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::614939597046:role/terraform-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      # --------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------
      # Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.action == 'init' ||
          github.event.inputs.action == 'validate' ||
          github.event.inputs.action == 'plan' ||
          github.event.inputs.action == 'apply' ||
          github.event.inputs.action == 'destroy' ||
          github.event.inputs.action == 'destroy-plan'
        run: terraform init -input=false

      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.action == 'validate' ||
          github.event.inputs.action == 'plan' ||
          github.event.inputs.action == 'apply' ||
          github.event.inputs.action == 'destroy' ||
          github.event.inputs.action == 'destroy-plan'
        run: terraform validate

      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------
      - name: Terraform Plan
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.action == 'plan' ||
          github.event.inputs.action == 'apply'
        run: |
          terraform plan \
            -input=false \
            -var-file=terraform.tfvars \
            -out=tfplan

      # --------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------
      - name: Terraform Apply
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'apply'
        run: |
          terraform apply \
            -input=false \
            tfplan

      # --------------------------------------------------
      # Terraform Destroy Plan
      # --------------------------------------------------
      - name: Terraform Destroy Plan
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'destroy-plan'
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -var-file=terraform.tfvars \
            -out=tfplan-destroy

      # --------------------------------------------------
      # Terraform Destroy
      # --------------------------------------------------
      - name: Terraform Destroy
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'destroy'
        run: |
          terraform destroy \
            -auto-approve \
            -input=false \
            -var-file=terraform.tfvars
name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - terraform-free-tier-learning
  pull_request:
    branches:
      - main
      - terraform-free-tier-learning
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - init
          - validate
          - plan
          - apply
          - destroy
          - destroy-plan

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.8.5
  TF_WORKING_DIR: terraform-aws-free-tier-learning
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-south-1' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: demo

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'init' || github.event.inputs.action == 'validate' || github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-plan'
        run: terraform init -input=false

      - name: Create tfvars from secrets
        run: |
          cat > terraform.tfvars <<'EOF'
          aws_region                = "${{ env.AWS_REGION }}"
          aws_account_id            = "${{ secrets.AWS_ACCOUNT_ID }}"
          terraform_role_arn        = "${{ secrets.TF_VAR_TERRAFORM_ROLE_ARN }}"
          client                    = "${{ secrets.TF_VAR_CLIENT }}"
          group                     = "${{ secrets.TF_VAR_GROUP }}"
          environment               = "${{ secrets.TF_VAR_ENVIRONMENT }}"
          vpc_cidr                  = "10.0.0.0/16"
          availability_zone         = "${{ secrets.TF_VAR_AVAILABILITY_ZONE }}"
          second_availability_zone  = "${{ secrets.TF_VAR_SECOND_AVAILABILITY_ZONE }}"
          public_subnet_1_cidr      = "${{ secrets.TF_VAR_PUBLIC_SUBNET_1_CIDR }}"
          public_subnet_2_cidr      = "${{ secrets.TF_VAR_PUBLIC_SUBNET_2_CIDR }}"
          private_subnet_cidr       = "${{ secrets.TF_VAR_PRIVATE_SUBNET_CIDR }}"
          ami_id                    = "${{ secrets.TF_VAR_AMI_ID }}"
          instance_type             = "t3.micro"
          key_pair_name             = "${{ secrets.TF_VAR_KEY_PAIR_NAME }}"
          application_port          = 80
          health_check_path         = "/"
          ssh_allowed_cidrs         = ["10.0.0.0/16", "49.36.123.45/32"]
          domain_name               = "${{ secrets.TF_VAR_DOMAIN_NAME }}"
          cloudfront_price_class    = "PriceClass_100"
          dns_provider              = "cloudflare"
          cloudflare_api_token      = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          cloudflare_zone_id        = "${{ secrets.CLOUDFLARE_ZONE_ID }}"
          EOF

      - name: Terraform validate
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'validate' || github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-plan'
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-plan'
        env:
          TF_VAR_terraform_role_arn: ${{ secrets.TF_VAR_TERRAFORM_ROLE_ARN }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_client: ${{ secrets.TF_VAR_CLIENT }}
          TF_VAR_group: ${{ secrets.TF_VAR_GROUP }}
          TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
          TF_VAR_domain_name: ${{ secrets.TF_VAR_DOMAIN_NAME }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_ami_id: ${{ secrets.TF_VAR_AMI_ID }}
          TF_VAR_availability_zone: ${{ secrets.TF_VAR_AVAILABILITY_ZONE }}
          TF_VAR_second_availability_zone: ${{ secrets.TF_VAR_SECOND_AVAILABILITY_ZONE }}
          TF_VAR_public_subnet_1_cidr: ${{ secrets.TF_VAR_PUBLIC_SUBNET_1_CIDR }}
          TF_VAR_public_subnet_2_cidr: ${{ secrets.TF_VAR_PUBLIC_SUBNET_2_CIDR }}
          TF_VAR_private_subnet_cidr: ${{ secrets.TF_VAR_PRIVATE_SUBNET_CIDR }}
        run: terraform plan -input=false -var-file=terraform.tfvars -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        env:
          TF_VAR_terraform_role_arn: ${{ secrets.TF_VAR_TERRAFORM_ROLE_ARN }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_client: ${{ secrets.TF_VAR_CLIENT }}
          TF_VAR_group: ${{ secrets.TF_VAR_GROUP }}
          TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
          TF_VAR_domain_name: ${{ secrets.TF_VAR_DOMAIN_NAME }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_ami_id: ${{ secrets.TF_VAR_AMI_ID }}
          TF_VAR_availability_zone: ${{ secrets.TF_VAR_AVAILABILITY_ZONE }}
          TF_VAR_second_availability_zone: ${{ secrets.TF_VAR_SECOND_AVAILABILITY_ZONE }}
          TF_VAR_public_subnet_1_cidr: ${{ secrets.TF_VAR_PUBLIC_SUBNET_1_CIDR }}
          TF_VAR_public_subnet_2_cidr: ${{ secrets.TF_VAR_PUBLIC_SUBNET_2_CIDR }}
          TF_VAR_private_subnet_cidr: ${{ secrets.TF_VAR_PRIVATE_SUBNET_CIDR }}
        run: terraform apply -input=false -var-file=terraform.tfvars tfplan

      - name: Terraform destroy plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy-plan'
        env:
          TF_VAR_terraform_role_arn: ${{ secrets.TF_VAR_TERRAFORM_ROLE_ARN }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_client: ${{ secrets.TF_VAR_CLIENT }}
          TF_VAR_group: ${{ secrets.TF_VAR_GROUP }}
          TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
          TF_VAR_domain_name: ${{ secrets.TF_VAR_DOMAIN_NAME }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_ami_id: ${{ secrets.TF_VAR_AMI_ID }}
          TF_VAR_availability_zone: ${{ secrets.TF_VAR_AVAILABILITY_ZONE }}
          TF_VAR_second_availability_zone: ${{ secrets.TF_VAR_SECOND_AVAILABILITY_ZONE }}
          TF_VAR_public_subnet_1_cidr: ${{ secrets.TF_VAR_PUBLIC_SUBNET_1_CIDR }}
          TF_VAR_public_subnet_2_cidr: ${{ secrets.TF_VAR_PUBLIC_SUBNET_2_CIDR }}
          TF_VAR_private_subnet_cidr: ${{ secrets.TF_VAR_PRIVATE_SUBNET_CIDR }}
        run: terraform plan -destroy -input=false -var-file=terraform.tfvars -out=tfplan-destroy

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        env:
          TF_VAR_terraform_role_arn: ${{ secrets.TF_VAR_TERRAFORM_ROLE_ARN }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_client: ${{ secrets.TF_VAR_CLIENT }}
          TF_VAR_group: ${{ secrets.TF_VAR_GROUP }}
          TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
          TF_VAR_domain_name: ${{ secrets.TF_VAR_DOMAIN_NAME }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_ami_id: ${{ secrets.TF_VAR_AMI_ID }}
          TF_VAR_availability_zone: ${{ secrets.TF_VAR_AVAILABILITY_ZONE }}
          TF_VAR_second_availability_zone: ${{ secrets.TF_VAR_SECOND_AVAILABILITY_ZONE }}
          TF_VAR_public_subnet_1_cidr: ${{ secrets.TF_VAR_PUBLIC_SUBNET_1_CIDR }}
          TF_VAR_public_subnet_2_cidr: ${{ secrets.TF_VAR_PUBLIC_SUBNET_2_CIDR }}
          TF_VAR_private_subnet_cidr: ${{ secrets.TF_VAR_PRIVATE_SUBNET_CIDR }}
        run: terraform destroy -auto-approve -input=false -var-file=terraform.tfvars

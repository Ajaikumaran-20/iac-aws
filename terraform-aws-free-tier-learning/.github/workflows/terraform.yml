name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - terraform-free-tier-learning

  pull_request:
    branches:
      - main
      - terraform-free-tier-learning

  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - init
          - validate
          - plan
          - apply
          - destroy-plan
          - destroy

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.8.5"
  TF_WORKING_DIR: "terraform-aws-free-tier-learning"
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    environment: demo

    defaults:
      run:
        working-directory: terraform-aws-free-tier-learning

    steps:

      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------
      # 3. Configure AWS using GitHub OIDC
      # --------------------------------------------------

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_VAR_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      # --------------------------------------------------
      # 4. Verify AWS Identity
      # --------------------------------------------------

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # --------------------------------------------------
      # 5. Create Terraform Variables
      # --------------------------------------------------

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region               = "${{ env.AWS_REGION }}"
          aws_account_id           = "${{ secrets.AWS_ACCOUNT_ID }}"

          client                   = "${{ secrets.TF_VAR_CLIENT }}"
          group                    = "${{ secrets.TF_VAR_GROUP }}"
          environment              = "${{ secrets.TF_VAR_ENVIRONMENT }}"

          vpc_cidr                 = "10.0.0.0/16"

          availability_zone        = "${{ secrets.TF_VAR_AVAILABILITY_ZONE }}"
          second_availability_zone = "${{ secrets.TF_VAR_SECOND_AVAILABILITY_ZONE }}"

          public_subnet_1_cidr     = "${{ secrets.TF_VAR_PUBLIC_SUBNET_1_CIDR }}"
          public_subnet_2_cidr     = "${{ secrets.TF_VAR_PUBLIC_SUBNET_2_CIDR }}"
          private_subnet_cidr      = "${{ secrets.TF_VAR_PRIVATE_SUBNET_CIDR }}"

          ami_id                   = "${{ secrets.TF_VAR_AMI_ID }}"
          instance_type            = "t3.micro"

          key_pair_name            = "${{ secrets.TF_VAR_KEY_PAIR_NAME }}"

          min_size                 = 1
          desired_capacity         = 1
          max_size                 = 1

          application_port         = 80
          health_check_path        = "/"

          ssh_allowed_cidrs        = ["10.0.0.0/16"]

          domain_name              = "${{ secrets.TF_VAR_DOMAIN_NAME }}"

          cloudfront_price_class   = "PriceClass_100"

          dns_provider             = "cloudflare"

          cloudflare_api_token     = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          cloudflare_zone_id       = "${{ secrets.CLOUDFLARE_ZONE_ID }}"
          EOF

      # --------------------------------------------------
      # 6. Terraform Init
      # --------------------------------------------------

      - name: Terraform Init
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.action == 'init' ||
          github.event.inputs.action == 'validate' ||
          github.event.inputs.action == 'plan' ||
          github.event.inputs.action == 'apply' ||
          github.event.inputs.action == 'destroy-plan' ||
          github.event.inputs.action == 'destroy'
        run: terraform init -input=false

      # --------------------------------------------------
      # 7. Terraform Validate
      # --------------------------------------------------

      - name: Terraform Validate
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.action == 'validate' ||
          github.event.inputs.action == 'plan' ||
          github.event.inputs.action == 'apply' ||
          github.event.inputs.action == 'destroy-plan' ||
          github.event.inputs.action == 'destroy'
        run: terraform validate

      # --------------------------------------------------
      # 8. Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.action == 'plan' ||
          github.event.inputs.action == 'apply'
        run: |
          terraform plan \
            -input=false \
            -var-file=terraform.tfvars \
            -out=tfplan

      # --------------------------------------------------
      # 9. Terraform Apply
      # --------------------------------------------------

      - name: Terraform Apply
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'apply'
        run: |
          terraform apply \
            -input=false \
            tfplan

      # --------------------------------------------------
      # 10. Terraform Destroy Plan
      # --------------------------------------------------

      - name: Terraform Destroy Plan
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'destroy-plan'
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -var-file=terraform.tfvars \
            -out=tfplan-destroy

      # --------------------------------------------------
      # 11. Terraform Destroy
      # --------------------------------------------------

      - name: Terraform Destroy
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'destroy'
        run: |
          terraform destroy \
            -auto-approve \
            -input=false \
            -var-file=terraform.tfvars